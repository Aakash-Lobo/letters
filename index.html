<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Three Letters From Jake</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Cormorant+Garamond:wght@400;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="scene">
    <!-- PHOTO FRAME -->
   <div class="photo-frame">
    <div class="frame-stand"></div>
    <div class="photo"></div>
</div>

    <!-- CHILI PLANT -->
    <div class="chili-plant">

        <div class="pot"></div>

        <div class="stem"></div>

        <div class="leaf leaf1"></div>
        <div class="leaf leaf2"></div>
        <div class="leaf leaf3"></div>
        <div class="leaf leaf4"></div>

        <div class="chili chili1"></div>
        <div class="chili chili2"></div>
        <div class="chili chili3"></div>

    </div>

    <!-- LETTER STACK -->
    <div class="letter-stack">
        <div class="letter l3"></div>
        <div class="letter l2"></div>
        <div class="letter l1"></div>
    </div>

    <div class="window-wrapper">

        <!-- LEFT CURTAIN -->
        <div class="curtain left">
            <div class="fabric"></div>
            <div class="rope"></div>
        </div>

        <!-- WINDOW -->
        <div class="window">

            <div class="sky"></div>

            <div class="moon"></div>

            <div class="moonlight"></div>

            <span class="star s1"></span>
            <span class="star s2"></span>
            <span class="star s3"></span>
            <span class="star s4"></span>
            <span class="star s5"></span>
            <span class="star s6"></span>
            <span class="star s7"></span>
            <span class="star s8"></span>

            <div class="hill"></div>

            <div class="house">
    <div class="roof"></div>
    <div class="window-light"></div>
    <div class="chimney"></div>

   <div class="dove">🕊️</div>
</div>

        </div>

        <!-- RIGHT CURTAIN -->
        <div class="curtain right">
            <div class="fabric"></div>
            <div class="rope"></div>
        </div>

    </div>

    <div class="shelf"></div>

    <!-- <div class="candle">
        <div class="flame"></div>
        <div class="wax"></div>
        <div class="candle-holder"></div>
    </div> -->

    <div class="quill-area">
    <div class="quill-feather"></div>
    <div class="quill-shaft"></div>
    <div class="ink"></div>
</div>

    <div class="content">

        <p><h1>Mansi,</h1></p>

        <p>One letter from Aakash</p>

        <button class="open-btn">
            OPEN THE WINDOW
        </button>

    </div>

</div>
<div class="flying-dove">
    🕊️
    <span class="bird-letter">✉️</span>
</div>

<div class="falling-letter">✉️</div>
    <div class="desk-letter">

    <div class="envelope-flap"></div>

    <div class="recipient">
        To Mansi ❤️
    </div>

</div>
</div>
<script src="js/script.js"></script> 
</body>
</html>
